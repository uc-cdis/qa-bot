apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: anythingllm
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: anythingllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: STORAGE_DIR
              value: {{ .Values.env.STORAGE_DIR | quote }}
            - name: DATABASE_URL
              value: "file:/app/server/storage/anythingllm.db"
            - name: PRISMA_DATABASE_URL
              value: "file:/app/server/storage/anythingllm.db"
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.storage.mountPath }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: anythingllm-pvc